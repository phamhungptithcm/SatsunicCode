name: Verify local checkpoint
on: [push, pull_request]
permissions:
  contents: read
jobs:
  emulator-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run verify:local
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npx firebase emulators:exec --project demo-satsuniccode --only auth,firestore,database,storage,functions 'GCLOUD_PROJECT=demo-satsuniccode FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 npm run seed && npm run test:e2e'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-evidence
          path: docs/evidence
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/release-gate.mjs
