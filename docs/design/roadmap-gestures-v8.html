<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Roadmap navigation prototype</title><style>*{box-sizing:border-box}body{margin:0;font:13px system-ui;color:#111c35;background:#fafbfe}main{padding:24px}h1{font-size:18px;margin:0 0 8px}p{color:#627088;margin:0 0 18px}#canvas{height:70vh;position:relative;overflow:hidden;touch-action:none;overscroll-behavior:contain;cursor:grab;border:1px solid #dfe5ef;border-radius:12px;background:radial-gradient(#dfe5ef 1px,transparent 1px) 0 0/24px 24px;user-select:none}#canvas:active{cursor:grabbing}#graph{width:900px;height:700px;transform-origin:0 0;position:relative}.node{position:absolute;padding:16px 24px;background:#eef1ff;border:1px solid #bec9fc;border-radius:8px;color:#163cff;text-align:center}svg{position:absolute;width:900px;height:700px;fill:none;stroke:#a8b0c1;stroke-width:2}.controls{position:absolute;bottom:16px;left:16px;display:flex;gap:6px}button{background:white;border:1px solid #dfe5ef;border-radius:8px;color:#111c35;width:40px;height:40px;cursor:pointer}#readout{position:absolute;right:16px;bottom:22px;color:#627088}</style><main><h1>DSA Roadmap · interaction prototype</h1><p>Two fingers to pan · Pinch or Ctrl/⌘ + scroll to zoom · Drag to move</p><div id="canvas" tabindex="0" aria-label="Roadmap navigation prototype"><div id="graph"><svg aria-hidden="true"><path d="M440 100 C440 160 230 160 230 240 M440 100 C440 160 650 160 650 240 M230 300 C230 400 440 400 440 480 M650 300 C650 400 440 400 440 480"/></svg><span class="node" style="left:340px;top:40px">Arrays &amp; Hashing</span><span class="node" style="left:155px;top:240px">Two Pointers</span><span class="node" style="left:610px;top:240px">Stack</span><span class="node" style="left:405px;top:480px">Trees</span></div><div class="controls"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="reset" aria-label="Reset graph">⛶</button></div><output id="readout"></output></div></main><script>
const canvas=document.querySelector('#canvas'),graph=document.querySelector('#graph'),out=document.querySelector('#readout');let v={x:0,y:0,z:1},points=new Map();const local=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};function render(){graph.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;out.value=Math.round(v.z*100)+'%'}function zoom(f,p){const z=Math.min(1.6,Math.max(.3,v.z*f)),ratio=z/v.z;v={x:p.x-(p.x-v.x)*ratio,y:p.y-(p.y-v.y)*ratio,z};render()}function pair(){const[a,b]=[...points.values()];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)}}canvas.addEventListener('wheel',e=>{if(e.target.closest('.controls'))return;e.preventDefault();const k=e.deltaMode===1?16:e.deltaMode===2?canvas.clientHeight:1;if(e.ctrlKey||e.metaKey)zoom(Math.exp(-e.deltaY*k*.005),local(e));else{v.x-=(e.shiftKey?e.deltaY:e.deltaX)*k;v.y-=(e.shiftKey?0:e.deltaY)*k;render()}},{passive:false});canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.controls')||![0,1].includes(e.button))return;points.set(e.pointerId,local(e));canvas.setPointerCapture(e.pointerId);e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;const old=points.get(e.pointerId),before=points.size===2?pair():null,p=local(e);points.set(e.pointerId,p);if(before){const after=pair();zoom(after.d/Math.max(before.d,1),before);v.x+=after.x-before.x;v.y+=after.y-before.y}else{v.x+=p.x-old.x;v.y+=p.y-old.y}render()});for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>points.delete(e.pointerId));const center=()=>({x:canvas.clientWidth/2,y:canvas.clientHeight/2});document.querySelector('#plus').onclick=()=>zoom(1.2,center());document.querySelector('#minus').onclick=()=>zoom(1/1.2,center());document.querySelector('#reset').onclick=()=>{v={x:0,y:0,z:1};render()};canvas.addEventListener('keydown',e=>{if(e.target!==canvas)return;let handled=true;switch(e.key){case '+':case '=':zoom(1.2,center());break;case '-':zoom(1/1.2,center());break;case '0':v={x:0,y:0,z:1};break;case 'ArrowLeft':v.x+=40;break;case 'ArrowRight':v.x-=40;break;case 'ArrowUp':v.y+=40;break;case 'ArrowDown':v.y-=40;break;default:handled=false}if(handled){e.preventDefault();render()}});render();
</script></html>
